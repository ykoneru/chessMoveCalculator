<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>

    <!-- Bootstrap for layout/components; my own styles load after so they can override it -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-4">

        <h1 class="text-center">Chess Game</h1>

        <!-- Screen 1: paste/upload a PGN. Visible by default. -->
        <div id="pgn-screen" class="row justify-content-center align-items-center min-vh-75">
            <div class="col-lg-6">
                <div class="card shadow-sm p-4">
                    <h3 class="mb-3">Load a PGN Game</h3>
                    <p class="text-muted">Paste PGN below or choose a `.pgn` file. After loading, the analyzer board will open with the starting position.</p>
                    <textarea id="pgn-input" class="form-control" rows="10" placeholder="Paste PGN here"></textarea>
                    <div class="mt-3 d-flex gap-2">
                        <input id="pgn-file" type="file" accept=".pgn" class="form-control form-control-sm" />
                        <button id="load-pgn" class="btn btn-primary">Load PGN</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Screen 2: step through the game + engine tools. Hidden (d-none) until a PGN loads. -->
        <div id="analyzer-screen" class="d-none">
            <div class="row">
                <div class="col-12 mb-3 d-flex justify-content-between align-items-center">
                    <div>
                        <h5>Chess Analyzer</h5>
                        <small class="text-muted">Use the navigation buttons to step through the loaded game.</small>
                    </div>
                    <button id="edit-pgn" class="btn btn-outline-secondary">Load Another PGN</button>
                </div>
            </div>
            <div class="row">
                <!-- Controls: everything here is just a labeled placeholder — script.js reads/writes it by id -->
                <div class="col-md-4">
                    <div class="card shadow-sm p-3 mb-3">
                        <h6>Navigation</h6>
                        <div class="btn-group w-100" role="group">
                            <button id="prev-move" class="btn btn-outline-secondary">Prev</button>
                            <button id="next-move" class="btn btn-outline-secondary">Next</button>
                            <button id="reset-game" class="btn btn-outline-danger">Reset</button>
                        </div>
                        <div class="mt-3">
                            <div><strong>Move:</strong> <span id="move-index">0</span> / <span id="move-count">0</span></div>
                            <div><strong>Current:</strong> <span id="current-move"></span></div>
                        </div>
                        <div class="mt-3">
                            <button id="suggest-move" class="btn btn-success w-100">Suggest Next Move</button>
                            <div class="mt-2"><strong>Engine:</strong> <span id="engine-status">Not started</span></div>
                            <div><strong>Best move:</strong> <span id="engine-move">-</span></div>
                            <!-- Enabled once a best move comes back from Stockfish -->
                            <button id="explain-move" class="btn btn-outline-primary btn-sm mt-2" disabled>Explain this move</button>
                            <div id="move-explanation" class="mt-2 small"></div>
                        </div>
                    </div>
                </div>

                <!-- Board is populated at runtime by createBoard() in script.js -->
                <div class="col-md-8 d-flex justify-content-center">
                    <div id="board"></div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- type="module" is required so this file can use ES `import` (chess.js) -->
    <script type="module" src="script.js"></script>

</body>

</html>
